<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PataFix Platform Console</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d9dee8;--panel:#fff;--page:#f3f5f8;--green:#147d64;--green-2:#0c604c;--red:#b42318;--amber:#b54708;--blue:#175cd3}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--page);font-size:14px;letter-spacing:0}
    button,input,select,textarea{font:inherit;letter-spacing:0}.hidden{display:none!important}
    .login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login-panel{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 12px 28px rgba(16,24,40,.08)}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{font-size:17px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}.field{margin-bottom:14px}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:10px 11px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(20,125,100,.12)}.textarea{min-height:80px;resize:vertical}
    .btn{border:1px solid transparent;border-radius:6px;padding:9px 13px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink)}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-2)}.btn-outline{border-color:var(--line)}.btn-danger{border-color:#fecdca;color:var(--red);background:#fff}.btn-sm{padding:6px 9px;font-size:12px}
    .error{color:var(--red);font-size:12px;margin-top:10px}.muted{color:var(--muted)}
    .app{min-height:100vh}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.topbar .brand{margin:0}.top-actions{display:flex;align-items:center;gap:10px}.admin-name{font-size:12px;color:var(--muted)}
    .content{max-width:1480px;margin:0 auto;padding:24px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.page-head h1{font-size:22px;margin:0 0 4px}.page-head p{margin:0;color:var(--muted);font-size:12px}.head-actions{display:flex;gap:8px;flex-wrap:wrap}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:7px;padding:15px}.kpi-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.kpi-value{font-size:24px;font-weight:800;margin-top:7px}.kpi-note{font-size:11px;color:var(--muted);margin-top:3px}
    .toolbar{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px;display:flex;gap:10px;margin-bottom:12px}.toolbar .input{max-width:360px}.toolbar .select{max-width:210px}
    .table-wrap{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #eaecf0;vertical-align:middle}th{font-size:11px;color:var(--muted);text-transform:uppercase;background:#fafbfc;position:sticky;top:0}td{font-size:13px}.business-name{font-weight:800}.business-id{font-size:10px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:800;text-transform:uppercase}.active{background:#d1fadf;color:#05603a}.pending_onboarding,.past_due{background:#fef0c7;color:#93370d}.suspended,.closed{background:#fee4e2;color:#912018}.trial{background:#dbeafe;color:#174ea6}
    .modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.55);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:8px;border:1px solid var(--line);padding:22px;box-shadow:0 20px 45px rgba(16,24,40,.25)}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:18px}.modal h2{font-size:18px;margin:0}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
    .feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feature-row{border:1px solid var(--line);border-radius:6px;padding:9px;display:flex;justify-content:space-between;align-items:center;gap:12px}.feature-row label{margin:0}.empty{padding:36px;text-align:center;color:var(--muted)}.loading{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.kpis{grid-template-columns:1fr 1fr}.modal-grid,.feature-grid{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 16px}.admin-name{display:none}}
    @media(max-width:520px){.kpis{grid-template-columns:1fr}.page-head{display:block}.head-actions{margin-top:12px}.toolbar{display:block}.toolbar>*{margin-bottom:8px;max-width:none!important}}
  </style>
</head>
<body>
  <section id="loginView" class="login-shell">
    <div class="login-panel">
      <div class="brand"><div class="brand-mark">PF</div><div><strong>PataFix Platform</strong><span>Owner operations console</span></div></div>
      <form id="loginForm">
        <div class="field"><label for="loginEmail">Email</label><input class="input" id="loginEmail" type="email" autocomplete="username" required></div>
        <div class="field"><label for="loginPassword">Password</label><input class="input" id="loginPassword" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" id="loginBtn" style="width:100%" type="submit">Sign in securely</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">PF</div><div><strong>PataFix Platform</strong><span>Private owner console</span></div></div>
      <div class="top-actions"><span class="admin-name" id="adminName"></span><button class="btn btn-outline btn-sm" onclick="signOut()">Sign out</button></div>
    </header>
    <main class="content">
      <div class="page-head"><div><h1>Businesses</h1><p>Packages, onboarding, limits and vendor status. The live vendor application is not changed from this console.</p></div><div class="head-actions"><button class="btn btn-outline" onclick="loadDashboard()">Refresh</button><button class="btn btn-primary" onclick="openCreateVendor()">Register vendor</button></div></div>
      <div id="kpis" class="kpis"></div>
      <div class="toolbar"><input class="input" id="search" placeholder="Search business or business ID" oninput="renderBusinesses()"><select class="select" id="statusFilter" onchange="renderBusinesses()"><option value="">All statuses</option><option value="pending_onboarding">Pending onboarding</option><option value="active">Active</option><option value="trial">Trial</option><option value="past_due">Past due</option><option value="suspended">Suspended</option><option value="closed">Closed</option></select></div>
      <div class="table-wrap"><table><thead><tr><th>Business</th><th>Package</th><th>Status</th><th>Onboarding</th><th>Clients</th><th>Branches</th><th>Staff</th><th>Active loans</th><th>Monthly fee</th><th>Actions</th></tr></thead><tbody id="businessRows"></tbody></table></div>
    </main>
  </section>

  <div id="modalRoot"></div>

  <script>
    const SUPABASE_URL='https://ixxnjxqwbpetdituqvyp.supabase.co';
    const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyZWYiOiJpeHhuanhxd2JwZXRkaXR1cXZ5cCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg0ODMxNzg1LCJleHAiOjIxMDA0MDc3ODV9.1160hs2orD_D_y8-f46_vmDrn16XngLn2mHWITzv8-8';
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'patafix-platform-console-auth-v1'}});
    let state={businesses:[],plans:[],payments:[],admin:null};

    const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const money=value=>'KES '+Number(value||0).toLocaleString('en-KE',{minimumFractionDigits:0,maximumFractionDigits:2});
    const planOf=b=>b.patafix_platform_plans||state.plans.find(p=>p.id===b.plan_id)||{};
    const effectiveMonthly=b=>b.monthly_fee_override??planOf(b).monthly_fee??0;

    async function invoke(action,body={}){
      const {data,error}=await client.functions.invoke('patafix-platform-console',{body:{action,...body}});
      if(error){let message=error.message;try{const d=await error.context?.json();message=d?.message||message}catch(_){}throw new Error(message)}
      if(!data?.ok)throw new Error(data?.message||'Platform request failed');
      return data;
    }

    document.getElementById('loginForm').addEventListener('submit',async event=>{
      event.preventDefault();const btn=document.getElementById('loginBtn');const out=document.getElementById('loginError');out.textContent='';btn.disabled=true;btn.textContent='Signing in...';
      try{const {error}=await client.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(error)throw error;await loadDashboard()}
      catch(error){out.textContent=error.message;await client.auth.signOut()}
      finally{btn.disabled=false;btn.textContent='Sign in securely'}
    });

    async function loadDashboard(){
      const app=document.getElementById('appView');const login=document.getElementById('loginView');
      try{const data=await invoke('dashboard');state={...state,...data};login.classList.add('hidden');app.classList.remove('hidden');document.getElementById('adminName').textContent=data.admin?.full_name||data.admin?.email||'';renderKpis();renderBusinesses()}
      catch(error){app.classList.add('hidden');login.classList.remove('hidden');document.getElementById('loginError').textContent=error.message;throw error}
    }

    function renderKpis(){
      const businesses=state.businesses||[];const active=businesses.filter(b=>b.status==='active').length;const pending=businesses.filter(b=>b.status==='pending_onboarding').length;const monthly=businesses.filter(b=>b.status==='active').reduce((sum,b)=>sum+Number(effectiveMonthly(b)),0);const clients=businesses.reduce((sum,b)=>sum+Number(b.counts?.clients||0),0);
      document.getElementById('kpis').innerHTML=[['Registered businesses',businesses.length,'All platform tenants'],['Active subscriptions',active,'Currently enabled'],['Pending onboarding',pending,'Awaiting payment or setup'],['Expected monthly revenue',money(monthly),clients+' clients managed']].map(x=>`<div class="kpi"><div class="kpi-label">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-note">${x[2]}</div></div>`).join('');
    }

    function renderBusinesses(){
      const q=document.getElementById('search').value.trim().toLowerCase();const status=document.getElementById('statusFilter').value;
      const rows=(state.businesses||[]).filter(b=>(!status||b.status===status)&&(!q||[b.display_name,b.business_id,b.slug].join(' ').toLowerCase().includes(q)));
      document.getElementById('businessRows').innerHTML=rows.map(b=>{const p=planOf(b);return `<tr><td><div class="business-name">${esc(b.display_name)}</div><div class="business-id">${esc(b.business_id)}</div></td><td>${esc(p.name||'Unassigned')}</td><td><span class="pill ${esc(b.status)}">${esc(b.status.replaceAll('_',' '))}</span></td><td>${esc(b.onboarding_payment_status)}</td><td>${b.counts?.clients||0}</td><td>${b.counts?.branches||0}</td><td>${b.counts?.staff||0}</td><td>${b.counts?.active_loans||0}</td><td>${money(effectiveMonthly(b))}</td><td><div class="actions">${b.onboarding_payment_status!=='paid'&&b.onboarding_payment_status!=='waived'?`<button class="btn btn-primary btn-sm" onclick="openActivate('${b.business_id}')">Confirm onboarding</button>`:''}<button class="btn btn-outline btn-sm" onclick="openManage('${b.business_id}')">Manage</button></div></td></tr>`}).join('')||'<tr><td colspan="10" class="empty">No matching businesses</td></tr>';
    }

    function showModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
    function closeModal(){document.getElementById('modalRoot').innerHTML=''}

    function openCreateVendor(){
      showModal(`<div class="modal-head"><div><h2>Register vendor</h2><div class="muted">Creates an isolated business in pending onboarding status.</div></div><button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button></div><form id="createVendorForm" onsubmit="createVendor(event)"><div class="modal-grid"><div class="field"><label>Business name</label><input class="input" id="vBusiness" required></div><div class="field"><label>Package</label><select class="select" id="vPlan">${state.plans.filter(p=>p.is_active).map(p=>`<option value="${esc(p.code)}">${esc(p.name)} - ${money(p.monthly_fee)}/month</option>`).join('')}</select></div><div class="field"><label>Administrator name</label><input class="input" id="vAdmin" required></div><div class="field"><label>Administrator email</label><input class="input" id="vEmail" type="email" required></div><div class="field"><label>Temporary password</label><input class="input" id="vPassword" type="password" minlength="8" required></div><div class="field"><label>Onboarding fee</label><input class="input" value="KES 7,500" disabled></div></div><div id="modalError" class="error"></div><div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button id="createVendorBtn" class="btn btn-primary" type="submit">Create pending vendor</button></div></form>`)
    }

    async function createVendor(event){event.preventDefault();const btn=document.getElementById('createVendorBtn');btn.disabled=true;btn.textContent='Creating...';try{await invoke('create_business',{businessName:document.getElementById('vBusiness').value,adminName:document.getElementById('vAdmin').value,email:document.getElementById('vEmail').value,password:document.getElementById('vPassword').value,planCode:document.getElementById('vPlan').value});closeModal();await loadDashboard()}catch(error){document.getElementById('modalError').textContent=error.message;btn.disabled=false;btn.textContent='Create pending vendor'}}

    function openActivate(businessId){const b=state.businesses.find(x=>x.business_id===businessId);showModal(`<div class="modal-head"><div><h2>Confirm onboarding payment</h2><div class="muted">${esc(b.display_name)} will be activated and monthly billing will begin next month.</div></div></div><div class="field"><label>M-Pesa reference</label><input class="input" id="payRef" required></div><div class="field"><label>Paying phone</label><input class="input" id="payPhone" placeholder="Optional"></div><div id="modalError" class="error"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="activateBtn" onclick="activateVendor('${businessId}')">Confirm payment and activate</button></div>`)}
    async function activateVendor(businessId){const btn=document.getElementById('activateBtn');btn.disabled=true;btn.textContent='Activating...';try{await invoke('mark_onboarding_paid',{businessId,reference:document.getElementById('payRef').value,phone:document.getElementById('payPhone').value});closeModal();await loadDashboard()}catch(error){document.getElementById('modalError').textContent=error.message;btn.disabled=false;btn.textContent='Confirm payment and activate'}}

    function openManage(businessId){const b=state.businesses.find(x=>x.business_id===businessId);const p=planOf(b);showModal(`<div class="modal-head"><div><h2>${esc(b.display_name)}</h2><div class="muted">${esc(b.business_id)}</div></div><button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button></div><div class="modal-grid"><div class="field"><label>Status</label><select class="select" id="mStatus">${['pending_onboarding','trial','active','past_due','suspended','closed'].map(x=>`<option value="${x}" ${b.status===x?'selected':''}>${x.replaceAll('_',' ')}</option>`).join('')}</select></div><div class="field"><label>Package</label><select class="select" id="mPlan">${state.plans.map(x=>`<option value="${esc(x.code)}" ${x.id===b.plan_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Monthly fee override</label><input class="input" id="mFee" type="number" min="0" value="${b.monthly_fee_override??''}" placeholder="Package default: ${p.monthly_fee||0}"></div><div class="field"><label>Client limit override</label><input class="input" id="mClients" type="number" min="1" value="${b.client_limit_override??''}" placeholder="Package default: ${p.max_clients??'Unlimited'}"></div><div class="field"><label>Branch limit override</label><input class="input" id="mBranches" type="number" min="1" value="${b.branch_limit_override??''}" placeholder="Package default: ${p.max_branches??'Unlimited'}"></div><div class="field"><label>Current counts</label><input class="input" value="${b.counts?.clients||0} clients, ${b.counts?.branches||0} branches" disabled></div></div><div class="field"><label>Internal notes</label><textarea class="textarea" id="mNotes">${esc(b.notes||'')}</textarea></div><div class="field"><label>Business feature overrides</label><div class="feature-grid">${['branches','advanced_accounting','company_assets','expenses'].map(key=>`<div class="feature-row"><label>${key.replaceAll('_',' ')}</label><span><button class="btn btn-outline btn-sm" onclick="setFeature('${businessId}','${key}',true)">Enable</button> <button class="btn btn-danger btn-sm" onclick="setFeature('${businessId}','${key}',false)">Disable</button></span></div>`).join('')}</div></div><div id="modalError" class="error"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveBusinessBtn" onclick="saveBusiness('${businessId}')">Save changes</button></div>`)}
    async function saveBusiness(businessId){const btn=document.getElementById('saveBusinessBtn');btn.disabled=true;btn.textContent='Saving...';try{await invoke('update_business',{businessId,status:document.getElementById('mStatus').value,planCode:document.getElementById('mPlan').value,monthly_fee_override:document.getElementById('mFee').value||null,client_limit_override:document.getElementById('mClients').value||null,branch_limit_override:document.getElementById('mBranches').value||null,notes:document.getElementById('mNotes').value});closeModal();await loadDashboard()}catch(error){document.getElementById('modalError').textContent=error.message;btn.disabled=false;btn.textContent='Save changes'}}
    async function setFeature(businessId,featureKey,enabled){try{await invoke('set_feature',{businessId,featureKey,enabled});document.getElementById('modalError').textContent=`${featureKey.replaceAll('_',' ')} ${enabled?'enabled':'disabled'} for this business.`}catch(error){document.getElementById('modalError').textContent=error.message}}
    async function signOut(){await client.auth.signOut();state={businesses:[],plans:[],payments:[],admin:null};document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden')}

    (async()=>{const {data}=await client.auth.getSession();if(data.session){try{await loadDashboard()}catch(_){}}})();
  </script>
</body>
</html>
